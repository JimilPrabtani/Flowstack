name: Boutique CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/boutique-microservices/**'
      - '.github/workflows/ci.yml'

# Least privilege by default; individual jobs opt in to what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis — runs before anything is built or pushed
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Catches credentials committed to the repo. This is exactly the class of
      # bug that put a live Postgres password in gitops/secrets.yml.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Terraform misconfiguration scanning: public API endpoints, unencrypted
      # volumes, permissive security groups.
      - name: Scan IaC with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: projects/Infrastructure
          format: sarif
          output: trivy-iac.sarif
          severity: HIGH,CRITICAL
          exit-code: '0' # report, do not block, until the backlog is clear

      - name: Upload IaC findings
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-iac.sarif') != ''
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  # ---------------------------------------------------------------------------
  # Dependency audit + type check per service
  # ---------------------------------------------------------------------------
  verify:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - gateway
          - orders
          - product-service
          - user-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: projects/boutique-microservices/backend/services/${{ matrix.service }}
        run: npm install

      - name: Audit dependencies
        working-directory: projects/boutique-microservices/backend/services/${{ matrix.service }}
        # Report known-vulnerable packages. Not blocking yet — flip to
        # `npm audit --audit-level=high` once the existing findings are cleared.
        run: npm audit --audit-level=high || true

      # Blocking: a type error means the image would not build anyway, so
      # failing here is cheaper than failing after the ECR push.
      - name: Type check
        working-directory: projects/boutique-microservices/backend/services/${{ matrix.service }}
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # Build and push
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [security-scan, verify]

    # Required for GitHub OIDC — short-lived credentials in place of standing
    # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY repository secrets.
    # Role setup is documented in README.md.
    permissions:
      contents: read
      id-token: write

    # Every matrix leg resolves the same registry, so publishing it as a job
    # output saves the downstream job an AWS round-trip of its own.
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            context: projects/boutique-microservices/backend
            dockerfile: services/auth/Dockerfile
          - service: gateway
            context: projects/boutique-microservices/backend
            dockerfile: services/gateway/Dockerfile
          - service: orders
            context: projects/boutique-microservices/backend
            dockerfile: services/orders/Dockerfile
          - service: product-service
            context: projects/boutique-microservices/backend
            dockerfile: services/product-service/Dockerfile
          - service: user-service
            context: projects/boutique-microservices/backend
            dockerfile: services/user-service/Dockerfile
          - service: frontend
            context: projects/boutique-microservices/frontend
            dockerfile: Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Assumes a role via short-lived OIDC credentials (valid ~1 hour).
      # Repo: JimilPrabtani/Flowstack. Set AWS_ROLE_ARN variable, delete
      # long-lived AWS keys.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: boutique-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -f "${{ matrix.context }}/${{ matrix.dockerfile }}" \
            -t "$REGISTRY/${{ matrix.service }}:$IMAGE_TAG" \
            "${{ matrix.context }}"

      # Scan the built image BEFORE it reaches the registry. ECR's scan-on-push
      # only reports after the vulnerable image is already stored and pullable.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0' # switch to '1' to block releases on new CVEs

      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: docker push "$REGISTRY/${{ matrix.service }}:$IMAGE_TAG"

  # ---------------------------------------------------------------------------
  # Update GitOps manifests
  # ---------------------------------------------------------------------------
  update-manifests:
    name: Update manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN with a job-scoped write permission
          # rather than a long-lived personal access token.
          persist-credentials: true

      - name: Update image tags
        env:
          REGISTRY: ${{ needs.build-and-push.outputs.registry }}
        run: |
          set -euo pipefail
          for SERVICE in auth gateway orders product-service user-service; do
            MANIFEST="gitops/k8s/backend/${SERVICE}.yml"
            sed -i -E "s|image: .*/${SERVICE}:.*|image: ${REGISTRY}/${SERVICE}:${IMAGE_TAG}|g" "$MANIFEST"
          done
          sed -i -E "s|image: .*/frontend:.*|image: ${REGISTRY}/frontend:${IMAGE_TAG}|g" \
            gitops/k8s/frontend/deployment.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/k8s/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${IMAGE_TAG}"
          git push
